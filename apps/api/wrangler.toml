name = "store"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Worker phục vụ luôn frontend (build từ apps/web), chỉ /api/* chạy qua Worker
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare D1 Database & KV Namespace
[[d1_databases]]
binding = "DB"
database_name = "store-db"
database_id = "691b9a4c-273f-41c1-ab89-bc4162699b20"

[[kv_namespaces]]
binding = "CART"
id = "26c77d60e71c40f491909c57983215d8"
